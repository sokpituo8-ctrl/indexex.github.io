<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    fieldset {
            border: 2px solid #3f51b5;
            border-radius: 4px;
            margin-bottom: 20px;
            padding: 15px;
        }
     legend {
            color: #1a237e;
            font-weight: bold;
            padding: 0 10px;
        }
        
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <body>
    <form style="text-align: center;">
      <fieldset style="font-family: Khmer Os Battambang;">
        <label for="" ><h3 style="text-align: center; ">សូមស្វាគមន៏មកកាន់ប្រព័ន្ធ</h3></label><br><br>
        <label for="">អុីមែលចូលប្រើប្រាស់</label><br>

        <input type="text"  placeholder="example@gmail.com"><br><br>

        <label for="">លេខសម្ងាត់ចូលប្រើប្រាស់</label><br>
        <input type="text" required="12" placeholder="password">

        <label for="" style="font-family: Khmer Os Battambang;"><p>បន្តជាមួយ</p></label>
        <style>input[type="text"],
        input[type="date"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #a6a6a6;
            border-radius: 3px;
            box-sizing: border-box;
            font-family: 'Khmer OS Battambang', sans-serif;
        }</style>
        <button type="submit" style="font-family: Khmer Os Battambang; text-align: center; background-color: aquamarine;">ចូលគណនី</button><br>
        <i class="fa-brands fa-facebook"></i>
        <i class="fa-brands fa-google"></i>
        <i class="fa-brands fa-apple"></i><br>
        <label for="" style="text-align: center;"><ins><b>ត្រូវការជំនួយ?</b></ins></label>
      </fieldset>
      
    </form>
  </body>
</html>
